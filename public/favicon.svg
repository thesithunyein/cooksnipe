<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CookSnipe">
  <!--
    The browser-tab icon. The landing and the app are paper #f2f0ec, so the tile is
    paper and the mark is ink — the same lockup as the header, and the only version
    that stays legible in both a light and a dark tab bar, where a transparent mark
    would disappear into one of them.
  -->
  <rect width="64" height="64" rx="14" fill="#f2f0ec"/>
  <g transform="translate(32 32) scale(0.78) translate(-32 -32)">
    <defs>
      <mask id="cooksnipe-favicon">
        <rect width="64" height="64" fill="#fff"/>
        <circle cx="45" cy="9.5" r="9" fill="#000"/>
        <circle cx="53.7" cy="16.8" r="8.5" fill="#000"/>
        <circle cx="56.6" cy="27.7" r="6.5" fill="#000"/>
        <circle cx="20" cy="21" r="4.2" fill="#000"/>
        <circle cx="40" cy="45" r="3.2" fill="#000"/>
        <circle cx="20" cy="43" r="2.6" fill="#000"/>
      </mask>
    </defs>
    <circle cx="32" cy="32" r="28" fill="#0d0c0b" mask="url(#cooksnipe-favicon)"/>
  </g>
</svg>
